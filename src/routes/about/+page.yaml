title: About Me

intro: >
  Hi! I'm Flo. I write and make things (code, graphics, stories) for the web.


  I am passionate about using incisive storytelling, visual explorations, and novel data to reveal new truths about how we interact with this world and each other. 


  Currently, I'm an interactive engineer at <a href="https://citizencodex.com" target="_blank" rel="noopener noreferrer">Citizen Codex</a>, where I create data stories on topics spanning pop culture to public health. My work involves end-to-end development from writing and reporting, to data analysis and data viz design, to graphics and web development. My visual journalism work has also been published in <a href="https://pudding.cool" target="_blank" rel="noopener noreferrer">The Pudding</a>.


  I majored in Economics and East Asian Studies at Wesleyan University, where I worked on various research projects involving quantitative analysis, data viz, language, and creative writing. Wanting to combine my interest in all of these fields at once, I studied the principles of data storytelling through the <a href="https://ledeprogram.com/" target="_blank" rel="noopener noreferrer">Lede Program</a> at Columbia University, where I got my second start designing graphics for the web. I got my first tinkering with Tumblr themes in middle school.


  Outside of computers, I enjoy being a minor public nuisance by vaulting and climbing and swinging over things with the lovely folks at <a href="https://pkgenboston.com/" target="_blank" rel="noopener noreferrer">Parkour Generations Boston</a>. I am also a perpetual beginner student of the humbling discipline that is <a href="https://www.eshcircusarts.com/" target="_blank" rel="noopener noreferrer">aerial straps</a> (and occasionally dabble in other circus arts). These days, I'm drawn to haunted houses, machines as mechanical extensions of organic bodies, fun and idiosyncratic personal websites, <a href="https://strudel.cc/workshop/getting-started/" target="_blank" rel="noopener noreferrer">making music with code</a>, cursed protagonists, and electroclash.
