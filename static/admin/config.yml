backend:
  name: github
  repo: retrospatial/florinasutanto
  branch: main
  skip_ci: true


collections:
  - name: posts
    label: Posts
    folder: /content/posts
    create: true
    path: "{{year}}/{{slug}}/index"
    slug: "{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string
        required: true

      - label: Slug
        name: slug
        widget: string
        required: false
        hint: leave blank to use title

      - label: Description
        name: desc
        widget: string
        required: false

      - label: Body
        name: body
        widget: markdown
        required: true

      - label: Date Published
        name: date_published
        widget: datetime
        format: YYYY-MM-DD
        time_format: true
        required: true

      - label: Date Updated
        name: date_updated
        widget: datetime
        format: YYYY-MM-DD
        time_format: true
        required: false

      - name: tags
        label: Tags
        widget: relation
        multiple: true
        collection: tags
        search_fields: [title]
        display_fields: [title]
        value_field: '{{slug}}'

  - name: tags
    label: Tags
    label_singular: Tag
    folder: /content/tags
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - name: title
        label: Title
        widget: string
        required: true
      - name: description
        label: Description
        widget: text
        required: false
      - name: image
        label: Image
        widget: image
        required: false

